[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cobalt"
version = "0.1.0"
description = "A domain-specific language model for Python, verified by tests rather than trusted"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "tokenizers>=0.19",
    "numpy>=1.26",
    "huggingface_hub>=0.24",
    "pyarrow>=15",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["dslm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"